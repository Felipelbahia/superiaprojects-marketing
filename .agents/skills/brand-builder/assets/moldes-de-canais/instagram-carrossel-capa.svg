<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <title>Molde: Instagram, capa de carrossel 1080x1350</title>
  <style>
    /* TROQUE as cores e a fonte pelos valores de design-system/tokens.json da marca */
    .bg{fill:#FFFFFF} .ink{fill:#161B20} .accent{fill:#1B6EF3} .muted{fill:#525C64} .line{stroke:#CFC5B8;fill:none}
    .t{font-family:Arial,Helvetica,sans-serif}
    .h{font-weight:700} .k{letter-spacing:.12em;text-transform:uppercase;font-weight:700}
    .slot{fill:none;stroke:#8A939B;stroke-width:3;stroke-dasharray:14 10}
    .gd{fill:none;stroke:#E0218A;stroke-width:3;stroke-dasharray:18 10}
    .gl{fill:#E0218A;font:700 22px Arial,sans-serif}
  </style>
  <rect class="bg" width="1080" height="1350"/>
  <rect class="accent" x="90" y="90" width="140" height="14"/>
  <text class="t k muted" x="90" y="300" font-size="30">{{secao}}</text>
  <g class="t h ink" font-size="78">
    <text x="90" y="520">{{titulo linha 1}}</text>
    <text x="90" y="612">{{titulo linha 2}}</text>
    <text x="90" y="704">{{titulo linha 3}}</text>
    <text x="90" y="796">{{titulo linha 4}}</text>
  </g>
  <g class="t muted" font-size="36">
    <text x="90" y="940">{{apoio linha 1}}</text>
    <text x="90" y="990">{{apoio linha 2}}</text>
  </g>
  <g id="logo-slot" transform="translate(90 1130)"><!-- SUBSTITUA este grupo pelo logo da marca (SVG mestre) -->
    <rect class="slot" width="320" height="110" rx="12"/>
    <text class="t muted" x="160" y="65" font-size="28" text-anchor="middle">LOGO</text>
  </g>
  <text class="t muted" x="990" y="1210" font-size="32" text-anchor="end">{{n}}/{{total}}</text>
  <g id="guides" display="none"><!-- remova display="none" para ver as guias; apague o grupo antes de exportar -->
    <rect class="gd" x="90" y="90" width="900" height="1170"/>
    <line class="gd" x1="33.75" y1="0" x2="33.75" y2="1350"/><line class="gd" x1="1046.25" y1="0" x2="1046.25" y2="1350"/>
    <text class="gl" x="100" y="80">margem 90 px</text><text class="gl" x="44" y="1335">recorte 3:4 [a confirmar]</text>
  </g>
</svg>
